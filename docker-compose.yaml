# Copy .env.example → .env and fill in GEMINI_API_KEY before running.

services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai_network

  mongo:
    image: mongo:6.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - ai_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - ai_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Serve on the same URL the browser uses so JWT issuer matches
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8181:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network

  # ── Spring Boot Services ──────────────────────────────────────────────────────

  eureka:
    build:
      context: ./backend/eureka
      dockerfile: Dockerfile
    container_name: eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_APPLICATION_NAME=eureka
      - SERVER_PORT=8761
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai_network

  configserver:
    build:
      context: ./backend/configserver
      dockerfile: Dockerfile
    container_name: configserver
    ports:
      - "8888:8888"
    environment:
      - SPRING_APPLICATION_NAME=configserver
      - SERVER_PORT=8888
    depends_on:
      eureka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/activity-service/default"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai_network

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      configserver:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=gateway
      - SERVER_PORT=8080
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      # Gateway fetches Keycloak JWKS internally via container name.
      # KC_HOSTNAME_STRICT=false ensures the issuer in JWTs matches localhost:8181.
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/fitness-oauth2/protocol/openid-connect/certs
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8181/realms/fitness-oauth2
    restart: unless-stopped
    networks:
      - ai_network

  userservice:
    build:
      context: ./backend/userservice
      dockerfile: Dockerfile
    container_name: userservice
    ports:
      - "8081:8081"
    depends_on:
      eureka:
        condition: service_healthy
      configserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=user-service
      - SERVER_PORT=8081
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    restart: unless-stopped
    networks:
      - ai_network

  activityservice:
    build:
      context: ./backend/activityservice
      dockerfile: Dockerfile
    container_name: activityservice
    ports:
      - "8082:8082"
    depends_on:
      eureka:
        condition: service_healthy
      configserver:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=activity-service
      - SERVER_PORT=8082
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://admin:password@mongo:27017/fitnessactivity?authSource=admin
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=password
    restart: unless-stopped
    networks:
      - ai_network

  aiservice:
    build:
      context: ./backend/aiservice
      dockerfile: Dockerfile
    container_name: aiservice
    ports:
      - "8083:8083"
    depends_on:
      eureka:
        condition: service_healthy
      configserver:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SPRING_APPLICATION_NAME=ai-service
      - SERVER_PORT=8083
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://admin:password@mongo:27017/fitnessrecomendation?authSource=admin
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=password
      - GEMINI_API_URL=${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    networks:
      - ai_network

  frontend:
    build:
      context: ./frontend/fitness-app-frontend
      dockerfile: Dockerfile
      args:
        # API calls go to /api — nginx proxies them to the gateway container
        VITE_API_URL: /api
        # Keycloak is accessed by the browser via the host port
        VITE_KEYCLOAK_URL: http://localhost:8181
        VITE_KEYCLOAK_REALM: fitness-oauth2
        VITE_KEYCLOAK_CLIENT_ID: oauth2-pkce-client
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
  keycloak_data:
