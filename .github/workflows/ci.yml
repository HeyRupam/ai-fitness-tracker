name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [eureka, configserver, gateway, userservice, activityservice, aiservice]
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/${{ matrix.service }}/pom.xml
      # The generated contextLoads tests need the full stack (config server, Mongo,
      # RabbitMQ, Postgres), so CI only verifies that each service compiles and packages.
      - run: ./mvnw -B -ntp verify -DskipTests

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/fitness-app-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  compose:
    name: Validate docker-compose.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
