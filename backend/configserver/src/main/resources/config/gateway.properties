server.port=8095

# Spring Cloud Gateway Routes - Use YAML syntax in properties file
spring.cloud.gateway.server.webflux.routes.[0].id=ai-service
spring.cloud.gateway.server.webflux.routes.[0].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes.[0].predicates[0]=Path=/api/recomendation/**

spring.cloud.gateway.server.webflux.routes.[1].id=user-service
spring.cloud.gateway.server.webflux.routes.[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes.[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes.[2].id=activity-service
spring.cloud.gateway.server.webflux.routes.[2].uri=lb://ACTIVITY-SERVICE
spring.cloud.gateway.server.webflux.routes.[2].predicates[0]=Path=/api/activities/**

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8092/eureka
eureka.instance.prefer-ip-address=true

# Must match the host the browser uses for Keycloak, otherwise the JWT "iss" claim won't validate
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/fitness-oauth2
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8181/realms/fitness-oauth2/protocol/openid-connect/certs

