server.port=8090
# PostgresSQL Database Config
# Defaults match the postgres container in docker-compose.yaml; override via env vars
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver
eureka.instance.prefer-ip-address=true

# JPA Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


#eureka
eureka.client.serviceUrl.defaultZone= http://localhost:8092/eureka
